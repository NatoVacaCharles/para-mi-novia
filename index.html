<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="heart.png" type="image/x-icon">
    <title>30 Días Para Tu Cumpleaños</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <canvas id="constellationCanvas"></canvas>

    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>

    <header class="header">
        <h1 class="title">30 Días Para Tu Cumpleaños</h1>
        <div class="countdown-container">
            <p class="countdown-subtitle">El gran día comienza en:</p>
            <div class="countdown">
                <div class="time-box"><span id="days">00</span><label>Días</label></div>
                <div class="time-box"><span id="hours">00</span><label>Horas</label></div>
                <div class="time-box"><span id="minutes">00</span><label>Min</label></div>
                <div class="time-box"><span id="seconds">00</span><label>Seg</label></div>
            </div>
        </div>
    </header>

    <main class="timeline-container">
        <div class="constellation-line"></div>
        <div id="surprise-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div class="modal-body">
                    <span class="modal-day" id="modal-day-text"></span>
                    <h2 id="modal-title"></h2>
                    <div class="modal-divider">✦ ✦ ✦</div>
                    <p id="modal-text"></p>
                </div>
            </div>
        </div>
    </main>

    <div class="final-gift-section">
    </div>

<script src="script.js" defer></script>
</body>

</html>
